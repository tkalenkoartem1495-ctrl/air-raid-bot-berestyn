name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render URL
        run: |
          echo "Pinging https://air-raid-bot-berestyn.onrender.com..."
          curl -s https://air-raid-bot-berestyn.onrender.com > /dev/null
          echo "Done!"
